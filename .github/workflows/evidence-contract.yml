name: Evidence contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify evidence-contract safeguards
        run: python -m unittest backend/tests/test_evidence_contract.py
